name: CI

on:
  push:
    branches: [developpement, main]
  pull_request:
    branches: [developpement, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Run tests
        run: crystal spec

      - name: Run linter
        run: bin/ameba
