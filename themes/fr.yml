# Thème français livré avec crystal-asciidoctor-pdf.
#
# Reprend les défauts du thème de base (Helvetica, marges A4, couleurs
# d'admonitions classiques) et y ajoute la francisation des libellés :
#
#   * Labels d'admonitions (NOTE → NOTE, TIP → ASTUCE, etc.)
#   * Titre de la table des matières
#   * Titre de l'index
#
# Activable via :
#
#     crystal-asciidoctor-pdf --theme fr mon-doc.adoc        (CLI)
#     :pdf-theme: fr                                          (source)
#     ThemeLoader.builtin("fr")                               (API Crystal)
#
# Alias acceptés : `fr`, `francais`, `french`.
#
# Pour personnaliser : copier ce fichier, l'éditer, et le charger
# avec ThemeLoader.load(path).

# --- Admonitions (libellés français) ---
admonition_note_label: "NOTE"
admonition_tip_label: "ASTUCE"
admonition_warning_label: "AVERTISSEMENT"
admonition_caution_label: "ATTENTION"
admonition_important_label: "IMPORTANT"

# --- Table des matières ---
# Le défaut crystal-asciidoctor-pdf est déjà "Table des matières",
# on le réaffirme ici pour l'explicite.
toc_title: "Table des matières"

# --- Index ---
index_title: "Index"

# --- Typographie française (extension `x-`) ---
# Active la convention typographique française : remplace l'espace
# ordinaire devant les signes de ponctuation à deux parties (`:`,
# `;`, `!`, `?`, `»`) et après le guillemet ouvrant `«` par un
# espace insécable (U+00A0). Empêche les sauts de ligne incorrects
# (« 12 :30 » → « 12<NBSP>:30 ») et respecte les règles de
# l'Imprimerie nationale.
x_french_typography: true

# --- Blocs de score (extension `x-score-*`) ---
# Les identifiants des niveaux restent en français côté source AsciiDoc
# (`[.x-score-tres-bien]`, etc.) — ce qui est documenté côté API.
# Ici on traduit uniquement les LIBELLÉS rendus dans la bande colorée.
x_score_excellent_label: "EXCELLENT"
x_score_tres_bien_label: "TRÈS BIEN"
x_score_bien_label: "BIEN"
x_score_insuffisant_label: "INSUFFISANT"
x_score_a_revoir_label: "À REVOIR"
